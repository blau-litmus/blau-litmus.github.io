<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blau-litmus</title>
<style>

/* Noto Sans JP の読み込み */
@font-face {
  font-family: "Noto Sans JP";
  src: url("fonts/NotoSansJP-VariableFont_wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

/* ページ全体 */
body {
  background-color: #1E2D40;
  color: #D1DCE8;
  font-family: "Noto Sans JP", sans-serif;
}

/* 見出し */
h1, h2 {
  color: #9BBCE3;
}

/* リンク一覧以外の通常リンク */
a {
  color: #8DBBFA;
}

/* リンク一覧の余白を調整 */
.link-list {
  list-style: none;
  padding: 0;
  max-width: 420px;
}

/* リンクカード */
.link-list li {
  margin: 12px 0;
}

.link-list a {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;

  background: #2B3D53;
  border: 1px solid #405672;
  border-radius: 14px;

  color: #A9CCFA;
  text-decoration: none;
  font-weight: 600;

  box-shadow: 0 3px 10px rgba(36, 91, 158, 0.05);
  transition: transform 0.2s ease,
              background-color 0.2s ease,
              box-shadow 0.2s ease;
}

/* マウスを乗せたとき */
.link-list a:hover {
  background: #364B65;
  color: #D0E4FF;
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
}

/* プロフィール画像 */
.link-icon {
  width: 42px;
  height: 42px;
  object-fit: contain;
  flex-shrink: 0;
}

/* リンク名 */
.link-list a > span:first-of-type {
  flex: 1;
}

/* 右端の矢印 */
.link-arrow {
  font-size: 18px;
  opacity: 0.6;
}

/* ヌメロンゲーム */
.numeron {
  max-width: 420px;
  margin: 32px 0;
  padding: 20px;
  box-sizing: border-box;

  background: #2B3D53;
  border: 1px solid #405672;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(36, 91, 158, 0.05);
}

.numeron-description {
  line-height: 1.7;
  font-size: 14px;
}

.numeron-form {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}

.numeron-input {
  min-width: 0;
  width: 100%;
  padding: 12px;
  box-sizing: border-box;

  border: 1px solid #506783;
  border-radius: 8px;
  background: #25364B;
  color: #E1EAF5;
  font-size: 20px;
  letter-spacing: 4px;
}

.numeron button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: #527FB8;
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.numeron button:hover {
  background: #6895CD;
}

.numeron button:focus-visible,
.numeron-input:focus-visible {
  outline: 2px solid #245b9e;
  outline-offset: 3px;
}

.numeron-result {
  min-height: 48px;
  padding: 12px;
  box-sizing: border-box;
  border-radius: 8px;
  background: #23344A;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.numeron-history {
  padding-left: 24px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.numeron-new-game {
  margin-top: 12px;
}

@media (max-width: 360px) {
  .numeron {
    padding: 14px;
  }

  .numeron-form {
    flex-wrap: wrap;
  }
}

</style>
</head>
<body>
  <h1>blau-litmus</h1>
  <p>Welcome to mypage. <3</p>

<section class="numeron">
  <h2>Numeron</h2>

  <p class="numeron-description">
    Guess the secret 3-digit number!<br>
    数字と位置が合えばEAT、数字だけ合えばBITEです。<br>
    何度でも挑戦できます！
  </p>

  <form id="numeron-form" class="numeron-form">
    <input
      id="numeron-input"
      class="numeron-input"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="3"
      placeholder="例：123"
      aria-label="3桁の数字"
      autocomplete="off"
      required
    >
    <button type="submit">判定</button>
  </form>

  <p id="numeron-result"
     class="numeron-result"
     aria-live="polite">
    3桁の数字を入力してください。
  </p>

  <h3>History</h3>
  <ol id="numeron-history" class="numeron-history">
  </ol>

  <button
    type="button"
    id="numeron-new-game"
    class="numeron-new-game">
    もう一度遊ぶ
  </button>
</section>

<h2>Links</h2>

<ul class="link-list">
  <li>
    <a href="https://store.steampowered.com/bundle/36564/XuanYuan_Sword_Bunble/" target="_blank" rel="noopener noreferrer">
      <img src="images/fur-favourite.jpg" alt="" class="link-icon">
      <span>好きなゲームその1　軒轅劍系列</span>
      <span class="link-arrow">↗</span>
    </a>
  </li>
  <li>
    <a href="https://www.falcom.co.jp/sora/" target="_blank" rel="noopener noreferrer">
      <img src="images/fur-favourite.jpg" alt="" class="link-icon">
      <span>好きなゲームその2　軌跡系列</span>
      <span class="link-arrow">↗</span>
    </a>
  </li>
  <li>
    <a href="https://www.grandiahd.com/" target="_blank" rel="noopener noreferrer">
      <img src="images/fur-favourite.jpg" alt="" class="link-icon">
      <span>好きなゲームその3　Grandia 1&2</span>
      <span class="link-arrow">↗</span>
    </a>
  </li>
  <li>
    <a href="https://note.com/blau_litmus" target="_blank" rel="noopener noreferrer">
      <img src="images/note-icon-white.png" alt="" class="link-icon">
      <span>note</span>
      <span class="link-arrow">↗</span>
    </a>
  </li>
  <li>
    <a href="https://www.twitch.tv/blau_litmus" target="_blank" rel="noopener noreferrer">
      <img src="images/glitch_flat_purple.png" alt="" class="link-icon">
      <span>Twitch</span>
      <span class="link-arrow">↗</span>
    </a>
  </li>
  <li>
    <a href="https://plurk.com/blau_litmus" target="_blank" rel="noopener noreferrer">
      <img src="images/479e7351bbf90f495360.png" alt="" class="link-icon">
      <span>Plurk</span>
      <span class="link-arrow">↗</span>
    </a>
  </li>
</ul>

  <footer>
    <p>&copy; 2026 blau-litmus</p>
  </footer>

<script>
(() => {
  const form = document.getElementById("numeron-form");
  const input = document.getElementById("numeron-input");
  const result = document.getElementById("numeron-result");
  const history = document.getElementById("numeron-history");
  const newGameButton = document.getElementById("numeron-new-game");
  const submitButton = form.querySelector('button[type="submit"]');

  let answer = "";
  let gameFinished = false;

  // 重複しない3桁の正解を作る
  function createAnswer() {
    const first = String(Math.floor(Math.random() * 9) + 1);
    const remaining = "0123456789"
      .replace(first, "")
      .split("");

    // 残りの数字をシャッフル
    for (let i = remaining.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
    }

    return first + remaining[0] + remaining[1];
  }

  // ゲームを初期化
  function startGame() {
    answer = createAnswer();
    gameFinished = false;
    input.value = "";
    input.disabled = false;
    submitButton.disabled = false;
    result.textContent = "3桁の数字を入力してください。";
    history.replaceChildren();
    input.focus();
  }

  // EATとBITEを判定
  function checkGuess(guess) {
    let eat = 0;
    let bite = 0;

    for (let i = 0; i < 3; i++) {
      if (guess[i] === answer[i]) {
        eat++;
      } else if (answer.includes(guess[i])) {
        bite++;
      }
    }

    return { eat, bite };
  }

  // 入力された数字を判定
  form.addEventListener("submit", (event) => {
    event.preventDefault();

    if (gameFinished) return;

    const guess = input.value.trim();

    if (!/^[0-9]{3}$/.test(guess)) {
      result.textContent = "半角数字で3桁入力してください。";
      return;
    }

    if (new Set(guess).size !== 3) {
      result.textContent = "同じ数字は使えません。別の数字を入力してください。";
      return;
    }

    const { eat, bite } = checkGuess(guess);

    const item = document.createElement("li");
    item.textContent = `${guess} — ${eat} EAT / ${bite} BITE`;
    history.prepend(item);

    if (eat === 3) {
      result.textContent = `正解！ 答えは ${answer} でした！`;
      gameFinished = true;
      input.disabled = true;
      submitButton.disabled = true;
    } else {
      result.textContent = `${eat} EAT / ${bite} BITE — もう一度！`;
    }

    input.value = "";
    if (!gameFinished) input.focus();
  });

  // 新しいゲームを開始
  newGameButton.addEventListener("click", startGame);

  // 最初のゲームを開始
  startGame();
})();
</script>

</body>
</html>
